<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- SLOT: title --></title>
<style>
/* Faces: an installed copy first, a pinned webfont from jsDelivr second, the system stack last.
   The @font-face families carry a "Web" suffix so they cannot shadow an installed copy -- a
   same-name @font-face outranks a system family, which would force the download on a machine
   that already has the font. An @font-face nobody uses is never fetched, so having the fonts
   installed costs no bytes and works offline. Nothing is bundled.
   SN Pro: webfonts/SNPro[ital,wght].woff2 is mislabelled upstream. It carries no ital axis while
   its OS/2 and name records claim italic, so browsers synthesise a slant from it; the upright
   variable under fonts/ is used instead and display italics fall back to the system face.
   Pins (fonts here, Mermaid, Vega and highlight.js in the script below) last checked 2026-09-11. */
@font-face { font-family: "SN Pro Web"; src: url("https://cdn.jsdelivr.net/gh/supernotes/sn-pro@e025ac475535/fonts/variable/SNPro%5Bwght%5D.ttf") format("truetype"); font-weight: 200 900; font-style: normal; font-display: swap; }
@font-face { font-family: "iA Writer Duo Web"; src: url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@f32c04c3058a/iA%20Writer%20Duo/Variable/iAWriterDuoV.ttf") format("truetype"); font-weight: 400 700; font-style: normal; font-display: swap; }
@font-face { font-family: "iA Writer Duo Web"; src: url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@f32c04c3058a/iA%20Writer%20Duo/Variable/iAWriterDuoV-Italic.ttf") format("truetype"); font-weight: 400 700; font-style: italic; font-display: swap; }
@font-face { font-family: "iA Writer Mono Web"; src: url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@f32c04c3058a/iA%20Writer%20Mono/Variable/iAWriterMonoV.ttf") format("truetype"); font-weight: 400 700; font-style: normal; font-display: swap; }
@font-face { font-family: "iA Writer Mono Web"; src: url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@f32c04c3058a/iA%20Writer%20Mono/Variable/iAWriterMonoV-Italic.ttf") format("truetype"); font-weight: 400 700; font-style: italic; font-display: swap; }
/* Tokens: Catppuccin Mocha (dark, primary on :root) and Latte (light); light applies on system preference or the toggle. Do not edit. */
:root {
  --ground: #1e1e2e; --surface: #181825; --surface-2: #313244;
  --line: #313244; --line-strong: #6c7086;
  --ink: #cdd6f4; --ink-2: #bac2de; --ink-3: #9399b2;
  --accent: #cba6f7; --accent-ink: #b4befe; --accent-soft: #cba6f71f;
  --good: #a6e3a1; --warn: #f9e2af; --bad: #f38ba8;
  --chart-cat: #89b4fa #fab387 #a6e3a1 #f9e2af #f5c2e7 #94e2d5 #cba6f7 #f38ba8;
  --tint: #2c3150; --tint-line: #585b8c;
  --blue: #89b4fa; --peach: #fab387; --green: #a6e3a1; --red: #f38ba8; --yellow: #f9e2af; --teal: #94e2d5; --pink: #f5c2e7;
  --blue-soft: #89b4fa26; --peach-soft: #fab38726; --green-soft: #a6e3a126; --red-soft: #f38ba826; --teal-soft: #94e2d526;
  --font-display: "SN Pro", "SN Pro Web", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-text: "iA Writer Duo V", "iA Writer Duo S", "iA Writer Duo Web", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-mono: "iA Writer Mono V", "iA Writer Mono S", "iA Writer Mono Web", ui-monospace, SFMono-Regular, Menlo, monospace;
  --measure: 860px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #eff1f5; --surface: #e6e9ef; --surface-2: #ccd0da;
    --line: #ccd0da; --line-strong: #7c7f93;
    --ink: #4c4f69; --ink-2: #5c5f77; --ink-3: #6c6f85;
    --accent: #8839ef; --accent-ink: #8839ef; --accent-soft: #8839ef1a;
    --good: #40a02b; --warn: #df8e1d; --bad: #d20f39;
    --chart-cat: #1e66f5 #fe640b #40a02b #df8e1d #ea76cb #179299 #8839ef #d20f39;
    --tint: #dfe4f7; --tint-line: #9aa3d6;
    --blue: #1e66f5; --peach: #fe640b; --green: #40a02b; --red: #d20f39; --yellow: #df8e1d; --teal: #179299; --pink: #ea76cb;
    --blue-soft: #1e66f51a; --peach-soft: #fe640b1f; --green-soft: #40a02b1f; --red-soft: #d20f391a; --teal-soft: #1792991f;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
--ground: #eff1f5; --surface: #e6e9ef; --surface-2: #ccd0da;
  --line: #ccd0da; --line-strong: #7c7f93;
  --ink: #4c4f69; --ink-2: #5c5f77; --ink-3: #6c6f85;
  --accent: #8839ef; --accent-ink: #8839ef; --accent-soft: #8839ef1a;
  --good: #40a02b; --warn: #df8e1d; --bad: #d20f39;
  --chart-cat: #1e66f5 #fe640b #40a02b #df8e1d #ea76cb #179299 #8839ef #d20f39;
  --tint: #dfe4f7; --tint-line: #9aa3d6;
  --blue: #1e66f5; --peach: #fe640b; --green: #40a02b; --red: #d20f39; --yellow: #df8e1d; --teal: #179299; --pink: #ea76cb;
  --blue-soft: #1e66f51a; --peach-soft: #fe640b1f; --green-soft: #40a02b1f; --red-soft: #d20f391a; --teal-soft: #1792991f;
  color-scheme: light;
}

/* Layout */
* { box-sizing: border-box; }
html { font-size: 17px; }
body { margin: 0; color: var(--ink); font: 400 0.9rem/1.6 var(--font-text); background: var(--ground); }
.page { max-width: 1520px; margin: 0 auto; padding: 32px 40px 64px; display: grid; gap: 48px;
        grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .page { grid-template-columns: 200px minmax(0, 1120px); column-gap: 72px; justify-content: center; } }
nav.toc { position: sticky; top: 24px; align-self: start; max-height: calc(100dvh - 48px); overflow: auto; }
nav.toc::before { content: "Index"; display: block; font: 500 11px/1 var(--font-mono); letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
nav.toc li { display: flex; gap: 10px; align-items: baseline; font: 400 0.85rem/1.35 var(--font-display); }
nav.toc li.h3 { padding-left: 24px; font-size: 0.8rem; }
nav.toc li .n { font: 400 12px/1 var(--font-mono); color: var(--accent); flex: none; }
nav.toc a { color: var(--ink-3); text-decoration: none; border-bottom: 1px solid transparent;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
nav.toc a.active { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 999px) {
  nav.toc { top: 0; max-height: none; background: var(--ground); z-index: 2; padding: 8px 0; }
  nav.toc::before { display: none; }
  nav.toc ol { flex-direction: row; gap: 16px; overflow-x: auto; }
  nav.toc li.h3 { display: none; }
  nav.toc a { white-space: nowrap; display: block; }
}
main { min-width: 0; counter-reset: sec fig tbl; display: flex; flex-direction: column; gap: 22px; }
main > * { margin: 0; }
/* Running text only. 860px is ~93 characters of iA Writer Duo at 0.9rem, from the advance widths the face
   actually carries over sample prose; Duo runs 1.2% wider than the IBM Plex Mono it is derived from.
   Figures, tables, tiles and headings stay full width -- they are looked at, not read line by line. */
main > p:not(.meta), main > ul, main > ol, main > .callout, main > .timeline, main > .not-doing { max-width: var(--measure); }

/* Type */
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 2.35rem; font-weight: 600; line-height: 1.1; }
h2 { font-size: 1.5rem; font-weight: 600; line-height: 1.2; margin-top: 30px;
  display: flex; gap: 12px; align-items: baseline; }
h2::before { counter-increment: sec; content: counter(sec, decimal-leading-zero);
  font: 400 12px/1 var(--font-mono); color: var(--accent); flex: none; }
h3 { font-size: 1.1rem; font-weight: 600; line-height: 1.25; margin-top: 12px; }
h2, h3 { scroll-margin-top: 72px; }
p { margin: 0; }
p.lead { font-size: 1.12em; line-height: 1.5; color: var(--ink-2); }
.meta { font: 400 12px/1.5 var(--font-mono); color: var(--ink-3); letter-spacing: 0.04em; }
a { color: var(--accent-ink); }
ul, ol { padding-left: 1.2rem; margin: 0; } li { margin: 4px 0; }
code, pre, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
td.num, th.num { font-variant-numeric: tabular-nums; }
code { font-size: 0.78em; background: var(--surface-2); padding: 1px 5px; }
pre { background: var(--surface); border: 1px solid var(--line); padding: 12px 16px; overflow-x: auto; font-size: 0.86rem; line-height: 1.55; }
pre code { background: none; padding: 0; }
/* highlight.js tokens, mapped onto the page tokens so they follow the theme. No CDN theme sheet:
   the artifact CSP allows no external style-src, and these colours are the Catppuccin mapping anyway. */
.hljs-comment, .hljs-quote { color: var(--ink-3); font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag { color: var(--accent); }
.hljs-string, .hljs-addition { color: var(--green); }
.hljs-number, .hljs-symbol, .hljs-bullet { color: var(--peach); }
.hljs-title, .hljs-title.function_, .hljs-section, .hljs-name { color: var(--blue); }
.hljs-type, .hljs-title.class_, .hljs-attribute, .hljs-selector-attr { color: var(--yellow); }
.hljs-built_in, .hljs-deletion { color: var(--red); }
.hljs-attr, .hljs-variable, .hljs-template-variable, .hljs-selector-class { color: var(--teal); }
.hljs-meta, .hljs-regexp, .hljs-link { color: var(--pink); }
.hljs-operator, .hljs-punctuation { color: var(--ink-2); }
.hljs-emphasis { font-style: italic; } .hljs-strong { font-weight: 600; }
strong { font-weight: 600; }

/* Figures: framed, stamped, numbered by CSS counters. Captions go below figures and above tables. */
figure { margin: 0; padding: 18px 20px 14px; border: 1px solid var(--line-strong); background: var(--surface);
  display: flex; flex-direction: column; gap: 12px; counter-increment: fig; }
figure::before { content: "Fig. " counter(fig); font: 400 11px/1 var(--font-mono); letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent); }
figcaption { font-size: 0.84rem; line-height: 1.45; color: var(--ink-2); }
figcaption::before { content: "Figure " counter(fig) ". "; font-weight: 600; color: var(--accent); }
figcaption b, figcaption strong { font-weight: 500; font-style: italic; color: var(--ink); }
figure svg { max-width: 100%; height: auto; display: block; color: var(--ink); }
figure.table { counter-increment: tbl; gap: 10px; }
figure.table::before { content: "Table " counter(tbl); order: -2; }
figure.table figcaption { order: -1; }
figure.table figcaption::before { content: "Table " counter(tbl) ". "; }
figure.table .fn { font-size: 0.74rem; color: var(--ink-3); line-height: 1.4; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
thead tr { border-bottom: 1px solid var(--line-strong); }
th { text-align: left; padding: 6px 8px; font-weight: 400; font-style: italic; color: var(--ink-2); font-size: 0.92em; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; }
.hot { color: var(--accent); }
.good { color: var(--good); } .bad { color: var(--bad); }
.tag { display: inline-block; font: 400 11px/1.6 var(--font-mono); letter-spacing: 0.04em; padding: 1px 8px;
  border: 1px solid currentColor; border-radius: 2px; color: var(--ink-2); }
.tag.blue { color: var(--blue); background: var(--blue-soft); } .tag.peach { color: var(--peach); background: var(--peach-soft); }
.tag.green { color: var(--green); background: var(--green-soft); } .tag.red { color: var(--red); background: var(--red-soft); }
.tag.teal { color: var(--teal); background: var(--teal-soft); } .tag.mauve { color: var(--accent); background: var(--accent-soft); }

/* Components */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 24px; }
.tile { display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--tint-line); padding-bottom: 6px; }
.tile .n { font: 500 1.9rem/1 var(--font-display); letter-spacing: -0.01em; }
.tile .k { font: 400 11px/1.3 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.callout { display: block; padding: 12px 16px; background: var(--tint);
  border-top: 1px solid var(--accent); border-bottom: 1px solid var(--accent); }
.callout::before { content: "Note"; display: inline-block; margin-right: 14px; font: 400 11px/1.6 var(--font-mono);
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); vertical-align: baseline; }
.callout[data-label]::before { content: attr(data-label); }
.callout.good, .callout.bad { color: var(--ink); }
.callout.good { background: var(--green-soft); border-color: var(--green); } .callout.good::before { color: var(--green); }
.callout.warn { background: var(--peach-soft); border-color: var(--peach); } .callout.warn::before { color: var(--peach); }
.callout.bad { background: var(--red-soft); border-color: var(--red); } .callout.bad::before { color: var(--red); }
.timeline { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; }
.timeline .when { font: 400 12px/1.7 var(--font-mono); color: var(--accent-ink); }
.not-doing { border: 1px dashed var(--line-strong); padding: 10px 14px 10px 32px; }
pre.mermaid { background: none; border: 0; padding: 0; overflow-x: auto; font-size: 1rem; }
.mermaid svg { max-width: 100%; height: auto; }
.status { display: inline-flex; gap: 6px; align-items: center; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.good { color: var(--green); } .status.warn { color: var(--yellow); } .status.bad { color: var(--red); }
button.theme { position: fixed; right: 16px; top: 16px; z-index: 3; font: 400 11px/1 var(--font-mono); letter-spacing: 0.1em;
  text-transform: uppercase; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line-strong); padding: 6px 10px; cursor: pointer; }
.vega-embed summary { background: var(--surface) !important; border: 1px solid var(--line-strong) !important;
  box-shadow: none !important; color: var(--ink-2); opacity: 0; transition: opacity 0.15s; }
.vega-embed:hover summary, .vega-embed[open] summary { opacity: 0.8; }
.vega-embed .vega-actions { background: var(--surface) !important; border: 1px solid var(--line-strong) !important; box-shadow: none !important; }
.vega-embed .vega-actions a { color: var(--ink) !important; font-family: var(--font-mono) !important; font-size: 12px !important; }
#vg-tooltip-element { background: var(--surface) !important; color: var(--ink) !important; border: 1px solid var(--line-strong) !important;
  box-shadow: none !important; font-family: var(--font-mono) !important; font-size: 12px !important; }
#vg-tooltip-element td.key { color: var(--ink-3) !important; }
@media print {
  :root { --ground: #ffffff; --surface: #ffffff; --surface-2: #e6e9ef; --line: #ccd0da; --line-strong: #6c6f85;
    --ink: #4c4f69; --ink-2: #5c5f77; --ink-3: #6c6f85; --accent: #8839ef; --accent-ink: #8839ef; --accent-soft: #8839ef1a;
    --chart-cat: #1e66f5 #fe640b #40a02b #df8e1d #ea76cb #179299 #8839ef #d20f39; color-scheme: light; }
  nav.toc, button.theme { display: none; }
  .page { grid-template-columns: 1fr; }
  h2 { break-after: avoid; }
  figure, .tile, table { break-inside: avoid; }
}
</style>
</head>
<body>
<button class="theme" type="button" aria-label="Toggle colour theme">Theme</button>
<div class="page">
  <nav class="toc" aria-label="Contents"><ol></ol></nav>
  <main>
    <p class="meta"><!-- SLOT: meta (date · sources · author or purpose) --></p>
    <h1><!-- SLOT: title --></h1>
    <p class="lead"><!-- SLOT: lead --></p>
    <!-- SLOT: sections -->
  </main>
</div>
<script>
(function () {
  var root = document.documentElement;
  try { var saved = localStorage.getItem('theme'); if (saved) root.dataset.theme = saved; } catch (e) {}
  function effective() {
    if (root.dataset.theme) return root.dataset.theme;
    return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.querySelector('button.theme').addEventListener('click', function () {
    var next = effective() === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    document.dispatchEvent(new CustomEvent('themechange'));
  });

  // Index from h2/h3: h2 entries numbered, the entry in view highlighted.
  var list = document.querySelector('nav.toc ol');
  var heads = Array.prototype.slice.call(document.querySelectorAll('main h2, main h3'));
  var n = 0;
  heads.forEach(function (h) {
    if (!h.id) h.id = h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    var li = document.createElement('li'); li.className = h.tagName.toLowerCase();
    if (li.className === 'h2') { n += 1; var num = document.createElement('span'); num.className = 'n';
      num.textContent = (n < 10 ? '0' : '') + n; li.appendChild(num); }
    var a = document.createElement('a'); a.href = '#' + h.id; a.textContent = h.dataset.toc || h.textContent;
    li.appendChild(a); list.appendChild(li);
  });
  var links = list.querySelectorAll('a');
  var ticking = false;
  function markActive() {
    ticking = false;
    var atEnd = innerHeight + scrollY >= document.documentElement.scrollHeight - 2;
    var current = 0;
    heads.forEach(function (h, i) { if (h.getBoundingClientRect().top <= 96) current = i; });
    if (atEnd) current = heads.length - 1;
    links.forEach(function (a, i) { a.classList.toggle('active', i === current); });
  }
  addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(markActive); } });
  addEventListener('resize', markActive);
  if (heads.length) markActive();

  var css = getComputedStyle(root);
  function tok(name) { return css.getPropertyValue(name).trim(); }
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }

  // Mermaid, themed from the tokens and re-rendered on toggle. Loaded only when used.
  if (document.querySelector('.mermaid')) {
    import('https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs').then(function (m) {
      var mermaid = m.default;
      var nodes = document.querySelectorAll('.mermaid');
      nodes.forEach(function (el) { el.dataset.src = el.textContent; });
      function render() {
        css = getComputedStyle(root);
        mermaid.initialize({
          startOnLoad: false, securityLevel: 'strict', theme: 'base', fontFamily: tok('--font-display'),
          gantt: { fontSize: 14, barHeight: 26, barGap: 8, topPadding: 44, leftPadding: 110, sectionFontSize: 14, numberSectionStyles: 2 },
          sequence: { actorFontFamily: tok('--font-display'), messageFontFamily: tok('--font-display'), noteFontFamily: tok('--font-display'), actorFontSize: 15, messageFontSize: 14, noteFontSize: 14 },
          themeVariables: {
            background: tok('--surface'), primaryColor: tok('--tint'), primaryTextColor: tok('--ink'),
            primaryBorderColor: tok('--tint-line'), lineColor: tok('--ink-2'), secondaryColor: tok('--surface'),
            tertiaryColor: tok('--ground'), edgeLabelBackground: tok('--surface'), fontSize: '15px',
            noteBkgColor: tok('--surface-2'), noteTextColor: tok('--ink'), noteBorderColor: tok('--line-strong'),
            actorBkg: tok('--surface-2'), actorBorder: tok('--ink-2'), actorTextColor: tok('--ink'),
            signalColor: tok('--ink-2'), signalTextColor: tok('--ink'), labelBoxBkgColor: tok('--surface-2'),
            labelTextColor: tok('--ink'), loopTextColor: tok('--ink'),
            taskBkgColor: tok('--tint'), taskBorderColor: tok('--tint-line'), taskTextColor: tok('--ink'), taskTextOutsideColor: tok('--ink'),
            taskTextLightColor: tok('--ink'), taskTextDarkColor: tok('--ink'),
            activeTaskBkgColor: tok('--accent-soft'), activeTaskBorderColor: tok('--accent'),
            doneTaskBkgColor: tok('--surface-2'), doneTaskBorderColor: tok('--line-strong'),
            critBkgColor: tok('--red-soft'), critBorderColor: tok('--red'),
            sectionBkgColor: 'transparent', sectionBkgColor2: 'transparent', altSectionBkgColor: 'transparent',
            gridColor: tok('--line'), todayLineColor: tok('--peach'), titleColor: tok('--ink'),
            transitionColor: tok('--ink-2'), transitionLabelColor: tok('--ink'), stateLabelColor: tok('--ink'), stateBkg: tok('--tint')
          }
        });
        nodes.forEach(function (el) { el.textContent = el.dataset.src; el.removeAttribute('data-processed'); });
        mermaid.run({ nodes: nodes });
      }
      render();
      document.addEventListener('themechange', render);
    });
  }

  // Vega-Lite through vega-embed, one shared config, SVG renderer. Loaded only when used.
  if (document.querySelector('.vega')) {
    loadScript('https://cdn.jsdelivr.net/npm/vega@6.4.0/build/vega.min.js')
      .then(function () { return loadScript('https://cdn.jsdelivr.net/npm/vega-lite@6.4.3/build/vega-lite.min.js'); })
      .then(function () { return loadScript('https://cdn.jsdelivr.net/npm/vega-embed@7.2.0/build/vega-embed.min.js'); })
      .then(function () {
        function config() {
          css = getComputedStyle(root);
          var cat = tok('--chart-cat').split(/\s+/);
          return {
            background: 'transparent', font: tok('--font-text'),
            mark: { color: cat[0] },
            point: { filled: true, size: 60 },
            axis: { labelColor: tok('--ink-3'), titleColor: tok('--ink-2'), gridColor: tok('--line'),
                    domainColor: tok('--ink-2'), tickColor: tok('--ink-2'),
                    labelFont: tok('--font-mono'), labelFontSize: 11, titleFont: tok('--font-text'), titleFontSize: 14, titleFontWeight: 400 },
            axisX: { labelAngle: 0 },
            axisDiscrete: { labelOverlap: false },
            axisQuantitative: { labelOverlap: 'parity' },
            header: { labelColor: tok('--ink-2'), titleColor: tok('--ink-2'), labelFont: tok('--font-mono'), labelFontSize: 12,
                      titleFont: tok('--font-text'), titleFontSize: 14, titleFontWeight: 400, labelPadding: 6 },
            legend: { labelColor: tok('--ink-2'), titleColor: tok('--ink-2'), labelFont: tok('--font-mono'), labelFontSize: 11,
                      titleFont: tok('--font-text'), titleFontSize: 14, titleFontWeight: 400,
                      symbolFillColor: tok('--ink-2'), symbolStrokeColor: tok('--ink-2') },
            title: { color: tok('--ink'), fontSize: 16, fontWeight: 400, anchor: 'start' },
            view: { stroke: null },
            range: { category: cat }
          };
        }
        function render() {
          document.querySelectorAll('.vega').forEach(function (el) {
            var spec = JSON.parse(el.querySelector('script[type="application/json"]').textContent);
            var view = el.querySelector('.vega-view');
            if (!view) { view = document.createElement('div'); view.className = 'vega-view'; el.appendChild(view); }
            vegaEmbed(view, spec, { config: config(), renderer: 'svg',
              actions: { export: true, source: false, compiled: false, editor: false } });
          });
        }
        render();
        document.addEventListener('themechange', render);
      });
  }

  // Syntax highlighting. Loaded only when a code block declares a language; the colours are in the CSS
  // above, so nothing is fetched from a style host. pre.mermaid has no <code> child and is never touched.
  if (document.querySelector('pre code[class*="language-"]')) {
    loadScript('https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js')
      .then(function () { hljs.highlightAll(); })
      .catch(function () {});
  }
})();
</script>
</body>
</html>
