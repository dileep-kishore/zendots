[codex_managed]
service_tier = "default"

[codex_managed.tui]
theme = "catppuccin-mocha"
status_line = [
    "model-with-reasoning",
    "current-dir",
    "git-branch",
    "branch-changes",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
    "fast-mode",
]

[codex_managed.mcp_servers.gh_grep]
url = "https://mcp.grep.app"

[codex_managed.mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[codex_managed.mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "codex", "--project-from-cwd"]

[codex_managed.mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[codex_managed.mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[codex_managed.mcp_servers.sequential-thinking.env]
DISABLE_THOUGHT_LOGGING = "true"

[codex_managed.plugins."google-calendar@openai-curated"]
enabled = true

[codex_managed.plugins."github@openai-curated"]
enabled = true

[codex_managed.plugins."linear@openai-curated"]
enabled = true

[codex_managed.plugins."superpowers@openai-curated"]
enabled = true

[codex_managed.plugins."ponytail@ponytail"]
enabled = true

[codex_managed.features]
js_repl = false
memories = true

[codex_managed.memories]
generate_memories = true
use_memories = true

[codex_managed.desktop]
appearanceTheme = "system"
appearanceLightCodeThemeId = "catppuccin"
appearanceDarkCodeThemeId = "catppuccin"
usePointerCursors = true
composerEnterBehavior = "cmdIfMultiline"
git-show-sidebar-pr-icons = true
git-commit-instructions = """
- Use conventional commit messages (feat:, fix:, chore:, refactor:, docs:, etc.)
- Keep commits atomic and focused.
- In the description, explain the "why" and "what" of the change, not just "how"."""
git-pr-instructions = """
- Use conventional commit messages (feat:, fix:, chore:, refactor:, docs:, etc.)
- In the description, explain the "why" and "what" of the change, not just "how"."""
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
show-context-window-usage = true
git-branch-prefix = ""

[codex_managed.desktop.appearanceLightChromeTheme]
accent = "#8839ef"
contrast = 45
ink = "#4c4f69"
opaqueWindows = false
surface = "#eff1f5"

[codex_managed.desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#40a02b"
diffRemoved = "#d20f39"
skill = "#8839ef"

[codex_managed.desktop.appearanceDarkChromeTheme]
accent = "#cba6f7"
contrast = 60
ink = "#cdd6f4"
opaqueWindows = false
surface = "#1e1e2e"

[codex_managed.desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#a6e3a1"
diffRemoved = "#f38ba8"
skill = "#cba6f7"
