profile = "default"

# A full-width bar sets macOS menu-bar auto-hide to Always (OmniWM 0.8.0+),
# which hides third-party menu bar icons, so the bar stays narrow on the left.
[profiles]

[profiles.default]
center = []
leading = ["omniwm", "workspaces", "scratchpads"]
theme = "catppuccin"
trailing = []

[profiles.default.workspaceBar]
fullWidth = false
height = 32.0
notchMode = "off"
position = "left"
reserveLayoutSpace = true
windowLevel = "status"

# Full-width top layout from 2026-11-08; it auto-hides the menu bar. To use it,
# replace the lanes above with these, then set fullWidth = true and
# position = "overlappingMenuBar".
# leading = ["apple-menu", "app-menu", "omniwm", "workspaces", "scratchpads"]
# center = []
# trailing = ["media", "notifications", "volume", "wifi", "battery-details", "control-center", "system-stats", "clock"]
