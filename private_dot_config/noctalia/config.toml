[theme]
source = "builtin"
builtin = "Catppuccin"
mode = "dark"

[shell]
avatar_path = "~/Pictures/linkedin_dp.jpeg"
card_borders = false
clipboard_auto_paste = "off"
polkit_agent = true
telemetry_enabled = false
panel_anchor_bar = "default"

[shell.launcher]
auto_paste = "off"

[shell.panel]
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"

[shell.screen_corners]
enabled = true
size = 20

[shell.shadow]
direction = "down_right"

[bar.default]
position = "top"
auto_hide = false
reserve_space = true
thickness = 37
background_opacity = 0.95
margin_edge = 0
margin_ends = 0
padding = 0
widget_spacing = 6
radius = 20
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 20
radius_bottom_right = 20
capsule = true
capsule_opacity = 1.0
capsule_thickness = 0.784
start = ["cat", "taskbar", "active_window", "group:media"]
center = ["workspace-apps", "clock"]
end = ["notifications", "updates", "tray", "syncthing", "group:system-monitor", "volume", "tailscale", "network", "control-center", "session", "caffeine"]

[[bar.default.capsule_group]]
id = "media"
members = ["media", "audio-vis"]

[[bar.default.capsule_group]]
id = "system-monitor"
members = ["cpu", "ram"]

[widget.cat]
type = "dotnetrob/cat:cat"
walk_threshold = 10

[widget.taskbar]
icon_scale = 1.0
show_all_outputs = false
only_active_workspace = false
show_window_title = false
window_title_max_width = 120

[widget.active_window]
min_length = 0
max_length = 200
title_scroll = "on_hover"
display = "icon_and_text"
show_empty_label = false

[widget.media]
min_length = 0
max_length = 250
art_size = 21
title_scroll = "on_hover"
hide_when_no_media = false
show_progress = true

[widget.audio-vis]
type = "audio_visualizer"
mirrored = true
show_when_idle = false

[widget.workspace-apps]
type = "taskbar"
group_by_workspace = true
show_all_outputs = false
only_active_workspace = false
show_workspace_label = true
workspace_label_placement = "corner"
hide_empty_workspaces = false
icon_scale = 1.15
inactive_opacity = 0.6
font_weight = 700
focused_color = "primary"
occupied_color = "secondary"
empty_color = "secondary"

[widget.clock]
format = "{:%H:%M | %a, %b %d}"
vertical_format = "{:%H %M - %d %m}"
tooltip_format = "{:%H:%M | %Y-%m-%d}"
font_family = "DankMono Nerd Font"

[widget.notifications]
hide_when_no_unread = false

[widget.updates]
type = "yuuto/arch-updater:widget"
hide_on_empty = false

[widget.tray]
drawer = true
hide_passive = true
pinned = ["No remote device connected", "proton-vpn-app", "At least one folder is out of sync", "Syncthing is idling\nConnected to MacOS (work)", "No unread messages", "You have unread messages", "proton.vpn.app.gtk", "You have 2 notifications"]

[widget.syncthing]
type = "rylos/syncthing:bar"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "gauge"
show_value = false
font_family = "monospace"

[widget.ram]
type = "sysmon"
stat = "ram_pct"
visualization = "gauge"
show_value = false
font_family = "monospace"

[widget.volume]
show_label = false

[widget.volume.actions]
middle = "exec pwvucontrol || pavucontrol"

[widget.tailscale]
type = "rylos/tailnet:bar"
show_ip = true
show_count = true

[widget.network]
show_label = false
vpn_status = "both"

[widget.control-center]
glyph = "noctalia"
icon_color = "primary"

[widget.session]
icon_color = "error"

[plugins]
enabled = ["dotnetrob/cat", "rylos/syncthing", "rylos/tailnet", "yuuto/arch-updater", "noctalia/timer"]
auto_update = "all"

[plugin_settings."rylos/syncthing"]
poll_interval = 10
insecure_tls = true

[plugin_settings."rylos/tailnet"]
poll_interval = 5
hide_mullvad = true
taildrop_dir = "~/Downloads"

[plugin_settings."yuuto/arch-updater"]
aur_helper = "paru"
auto_check_hours = 1
terminal = "ghostty"
flatpak_enabled = false
check_arch_news = false
check_reboot_needed = false
show_download_size = false
notify_on_updates = false

[audio]
enable_sounds = false
enable_overdrive = false

[battery]
warning_threshold = 20

[dock]
enabled = false

[desktop_widgets]
enabled = false

[idle]
pre_action_fade_seconds = 5

[idle.behavior.lock]
enabled = false
timeout = 660

[idle.behavior.screen-off]
enabled = false
timeout = 600

[idle.behavior.lock-and-suspend]
enabled = false
action = "suspend"
timeout = 1800

[lockscreen]
lock_before_suspend = false
blur_intensity = 0
tint_intensity = 0
transition_duration = 0

[nightlight]
enabled = false
temperature_day = 6500
temperature_night = 4000

[notification]
background_opacity = 1.0
layer = "overlay"
keep_dismissed_in_history = false

[osd]
background_opacity = 1.0
hide_delay_ms = 2000
position = "top_right"
position_vertical = "top_right"

[osd.kinds]
volume = true
volume_input = true
volume_output = true
brightness = true
wifi = false
bluetooth = false
power_profile = false
caffeine = false
nightlight = false
dnd = false
lock_keys = false
keyboard_layout = false
media = false
privacy = false
keyboard_backlight = false

[control_center.calendar]
show_week_numbers = true
show_events_card = true

[[control_center.shortcuts]]
type = "wifi"
[[control_center.shortcuts]]
type = "bluetooth"
[[control_center.shortcuts]]
type = "notification"
[[control_center.shortcuts]]
type = "power_profile"
[[control_center.shortcuts]]
type = "caffeine"
[[control_center.shortcuts]]
type = "nightlight"

[shell.session]
show_shortcuts = true

[[shell.session.actions]]
action = "lock"
shortcut = "1"
countdown_seconds = 10
[[shell.session.actions]]
action = "suspend"
shortcut = "2"
countdown_seconds = 10
[[shell.session.actions]]
action = "command"
label = "Hibernate"
glyph = "moon"
command = "systemctl hibernate"
shortcut = "3"
countdown_seconds = 10
[[shell.session.actions]]
action = "reboot"
shortcut = "4"
countdown_seconds = 10
[[shell.session.actions]]
action = "logout"
shortcut = "5"
countdown_seconds = 10
[[shell.session.actions]]
action = "shutdown"
variant = "destructive"
shortcut = "6"
countdown_seconds = 10
[[shell.session.actions]]
action = "command"
label = "Reboot to firmware"
glyph = "settings"
command = "systemctl reboot --firmware-setup"
shortcut = "7"
countdown_seconds = 10

[system.monitor]
cpu_usage_activity_threshold = 80
cpu_usage_critical_threshold = 90
cpu_temp_activity_threshold = 80
cpu_temp_critical_threshold = 90
gpu_usage_activity_threshold = 80
gpu_usage_critical_threshold = 90
gpu_temp_activity_threshold = 80
gpu_temp_critical_threshold = 90
ram_pct_activity_threshold = 80
ram_pct_critical_threshold = 90
swap_pct_activity_threshold = 80
swap_pct_critical_threshold = 90
disk_used_pct_activity_threshold = 80
disk_used_pct_critical_threshold = 90

[weather]
enabled = true
unit = "imperial"

[wallpaper]
enabled = false
directory = "~/Pictures/Wallpapers"
transition = ["wipe"]
transition_duration = 1500
edge_smoothness = 0.05
