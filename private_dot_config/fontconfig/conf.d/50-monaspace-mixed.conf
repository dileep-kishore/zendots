<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Virtual family "Monaspace Mixed": Neon roman, Krypton bold, Radon italic.
  Mirrors the per-style font-family split in ghostty/kitty for apps that only
  accept a single family name (Orca's xterm.js terminal). The name matches no
  real font, so nothing but an explicit request for it is affected.

  To use it in Orca: Settings -> Terminal -> Appearance -> Font Family, type
  "Monaspace Mixed" (it won't appear in the suggestion list, since no installed
  font carries that name), then restart Orca so Chromium re-reads fontconfig.
  Orca stores this in its leveldb profile, so it can't be managed by chezmoi.

  Italic resets slant to roman, matching ghostty's font-style-italic = "Light":
  Radon's handwriting shapes are the distinction, so its true italic faces come
  out slanted twice over.

  Order matters: fontconfig fills in default slant/weight only after config
  substitution, so a request with neither set must fall through to the
  unconditional rule at the end.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq"><string>Monaspace Mixed</string></test>
    <test name="slant" compare="not_eq"><const>roman</const></test>
    <edit name="family" mode="assign" binding="same"><string>Monaspace Radon Frozen</string></edit>
    <edit name="slant" mode="assign" binding="same"><const>roman</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Monaspace Mixed</string></test>
    <test name="weight" compare="more_eq"><const>bold</const></test>
    <edit name="family" mode="assign" binding="same"><string>Monaspace Krypton Frozen</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Monaspace Mixed</string></test>
    <edit name="family" mode="assign" binding="same"><string>Monaspace Neon Frozen</string></edit>
  </match>
</fontconfig>
