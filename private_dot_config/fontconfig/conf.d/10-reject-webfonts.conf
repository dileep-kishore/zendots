<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Reject WOFF/WOFF2 web fonts. freetype 2.14 indexes them with broken
     metadata, so fontconfig hands them to apps (e.g. Ghostty) that can't
     load WOFF, causing FontconfigNoMatch / SurfaceError crashes. The same
     families ship as .otf/.ttf, so nothing is lost. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*.woff</glob>
      <glob>*.woff2</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
