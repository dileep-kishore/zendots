sourceDir = "~/zendots"

[diff]
  format = "git"
  # Empty so `chezmoi diff` emits plain git-format text: delta writes
  # side-by-side ANSI even into a pipe, which agents cannot read.
  pager = ""

[merge]
  command = "nvim"
  args = ["-d", "{{ .Destination }}", "{{ .Source }}", "{{ .Target }}"]

[data]
  personal = true
